name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # 规则集见 ruff.toml（E4/E7/E9/F，启动脚本豁免E402）
      - name: Ruff lint
        run: ruff check src tests main.py plugins tools scripts

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile all sources
        run: python -m compileall -q src main.py plugins

      # 覆盖率统计范围与阈值见 .coveragerc（UI层与桥接子进程除外）
      - name: Run unit tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m coverage run -m unittest discover tests -v
          python -m coverage report

      - name: Upload coverage HTML report
        if: matrix.python-version == '3.12'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m coverage html

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  build:
    needs: [lint, test]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build executable (PyInstaller)
        run: python scripts/build_exe.py --clean

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiagTools-windows
          path: dist/DiagTools/
          retention-days: 14
